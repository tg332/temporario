<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aceita sair comigo?</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#141414;--grid:#1d1d1d;--card:#b45fe6;--card-d:#7e2fb0;--ink:#000;--btn:#fff;--btn-h:#ffe66b;--txt:#fff;--yes:#6bdc8b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:24px 24px;
display:flex;align-items:center;justify-content:center;font-family:"Pixelify Sans","Courier New",monospace;overflow:hidden}
.wrap{width:min(92vw,440px)}
.tela{display:none;flex-direction:column;align-items:center}
.tela.on{display:flex;animation:pop .3s steps(3)}
@keyframes pop{from{transform:scale(.85);opacity:.4}to{transform:scale(1);opacity:1}}
.snoopy{width:min(62vw,280px);image-rendering:pixelated;margin-bottom:-18px;animation:bob 1.6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.fig{background:#fff;padding:8px;margin-bottom:22px;box-shadow:0 0 0 4px var(--card),0 0 0 8px var(--card-d)}
.fig img{display:block;height:min(26vh,190px);width:auto;max-width:70vw;image-rendering:pixelated}
.card{position:relative;z-index:2;width:100%;background:var(--card);padding:26px 22px 24px;text-align:center;
box-shadow:0 -4px 0 var(--ink),0 4px 0 var(--ink),-4px 0 0 var(--ink),4px 0 0 var(--ink),0 12px 0 4px var(--card-d)}
.card.ok{background:var(--yes);box-shadow:0 -4px 0 var(--ink),0 4px 0 var(--ink),-4px 0 0 var(--ink),4px 0 0 var(--ink),0 12px 0 4px #2f9e55}
h1{margin:0 0 20px;font-size:clamp(20px,5.5vw,26px);font-weight:600;color:var(--txt);text-shadow:2px 2px 0 var(--card-d);letter-spacing:.5px}
.card.ok h1{text-shadow:2px 2px 0 #2f9e55}
.actions{display:flex;justify-content:space-between;align-items:center;height:56px}
button,input{font:600 20px "Pixelify Sans","Courier New",monospace;color:var(--ink);border:0}
button{background:var(--btn);padding:10px 0;width:44%;cursor:pointer;
box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink),0 7px 0 3px var(--card-d);transition:transform .08s steps(2)}
button:hover:not(:disabled),button:focus-visible{background:var(--btn-h);outline:none}
button:active:not(:disabled){transform:translateY(4px)}
button:disabled{opacity:.55;cursor:not-allowed}
button.solo{width:60%;display:block;margin:26px auto 6px}
input{color-scheme:light;display:block;width:100%;background:#fff;padding:12px 14px;text-align:center;
box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink),0 7px 0 3px var(--card-d)}
input:focus{outline:none;background:#fff8d6}
.resumo{margin:0;padding:0;list-style:none;font-size:22px;color:var(--txt);text-shadow:2px 2px 0 #2f9e55;line-height:1.5}
.resumo b{color:var(--ink);text-shadow:none;background:#fff;padding:0 6px}
.c{position:fixed;top:-20px;width:10px;height:10px;z-index:5;animation:cai linear forwards;pointer-events:none}
@keyframes cai{to{transform:translateY(110vh) rotate(360deg)}}
</style></head><body>

<script>
// COLE AQUI o endereço do seu formulário do Formspree (ex: https://formspree.io/f/abcdwxyz)
const ENDPOINT='https://formspree.io/f/xjyyepod';
function enviar(dados){
  fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(dados)}).catch(()=>{});
}
const $=id=>document.getElementById(id);
function ir(n){document.querySelectorAll('.tela').forEach(t=>t.classList.remove('on'));$('t'+n).classList.add('on');
  const f=$('t'+n).querySelector('input');if(f)f.focus();}
$('dia').min=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
$('sim').addEventListener('click',()=>ir(1));
$('nao').addEventListener('click',()=>{
  try{localStorage.setItem('convite_bloqueado','1');}catch(e){}
  enviar({resposta:'Não'});ir(5);
});
try{if(localStorage.getItem('convite_bloqueado')==='1')ir(5);}catch(e){}
document.querySelectorAll('form[data-next]').forEach(f=>f.addEventListener('submit',e=>{
  e.preventDefault();
  const n=+f.dataset.next;
  if(n===4){
    const [y,m,d]=$('dia').value.split('-').map(Number);
    $('r-dia').textContent=new Date(y,m-1,d).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
    $('r-hora').textContent=$('hora').value;
    $('r-oque').textContent=$('oque').value.trim();
    enviar({resposta:'Sim',dia:$('r-dia').textContent,hora:$('hora').value,atividade:$('oque').value.trim()});
    confete();
  }
  ir(n);
}));
function confete(){
  const cores=['#ffe66b','#ff6b9d','#6bdc8b','#6bc7ff','#fff','#b45fe6'];
  for(let i=0;i<70;i++){
    const d=document.createElement('i');d.className='c';
    d.style.left=Math.random()*100+'vw';d.style.background=cores[i%cores.length];
    d.style.animationDuration=(2+Math.random()*2.5)+'s';d.style.animationDelay=Math.random()*.8+'s';
    document.body.appendChild(d);setTimeout(()=>d.remove(),5500);
  }
}
</script></body></html>
